[package]
name = "orbit-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Benchmark harness: search, data, and end-to-end hotkey timing. Emits JSON and Markdown and gates regressions."

[[bin]]
name = "orbit-bench"
path = "src/main.rs"

[[bin]]
name = "orbit-bench-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "orbit-bench-fake-cli"
path = "src/bin/fake_cli.rs"

[dependencies]
orbit-core.workspace = true
orbit-data.workspace = true
orbit-hotkeys.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
